name: Release & Publish Docker

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Increment (auto-bump; default patch)'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]
      version:
        description: 'Explicit version (optional; overrides auto-bump, e.g. 1.13.0)'
        required: false
        type: string
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump version files & create tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine.outputs.version }}
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: determine
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            LATEST="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')"
            if [ -z "$LATEST" ]; then LATEST="0.0.0"; fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            case "${{ github.event.inputs.bump }}" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *)     PATCH=$((PATCH+1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version in HotelScraper.Api.csproj
        run: |
          sed -i "s|<Version>.*</Version>|<Version>${{ steps.determine.outputs.version }}</Version>|" backend/src/HotelScraper.Api/HotelScraper.Api.csproj

      - name: Bump version in frontend/package.json
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.determine.outputs.version }}\"/" frontend/package.json

      - name: Commit version bump
        run: |
          git add backend/src/HotelScraper.Api/HotelScraper.Api.csproj frontend/package.json
          git commit -m "chore: bump version to ${{ steps.determine.outputs.version }}"
          git push

      - name: Create and push tag
        run: |
          git tag v${{ steps.determine.outputs.version }}
          git push origin v${{ steps.determine.outputs.version }}

  changelog:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: bump-version
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && needs.bump-version.result == 'success') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ needs.bump-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: .github/release-changelog-config.json
          toTag: ${{ steps.tag.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [changelog, bump-version]
    if: |
      always() && (
        needs.changelog.result == 'success' ||
        needs.changelog.result == 'skipped'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ needs.bump-version.outputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Strip 'v' prefix for NuGet-compatible version (e.g. v1.8.0 → 1.8.0)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tomat3/hotel-price-scraper
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
