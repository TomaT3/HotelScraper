services:
  hotelscraper:
    build: .
    container_name: hotel-price-tracker
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
    environment:
      - Scraper__RapidApiKey=${RAPIDAPI_KEY}
      - Scraper__DatabaseUrl=data/hotel_prices.db
      - Scraper__DatesPerRun=${DATES_PER_RUN:-3}
      - Scraper__FetchHour=${FETCH_HOUR:-3}
      - Scraper__SearchCities=Stuttgart,Tübingen
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
